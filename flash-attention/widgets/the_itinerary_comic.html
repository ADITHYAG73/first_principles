<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget 3 — The itinerary, as a comic</title>
<style>
  .iw{--paper:#FDFCF9;--ink:#1A1A1E;--ink-soft:#5A5A63;--hairline:#E4E1DA;--machine:#8A8A93;
    --shelf:#1E7A62;--shelf-wash:rgba(30,122,98,.12);--asker:#5A50C0;--asker-wash:rgba(90,80,192,.12);
    --serif:Charter,Georgia,'Times New Roman',serif;--mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
    background:var(--paper);color:var(--ink);font-family:var(--serif);border:1px solid var(--hairline);
    border-radius:6px;padding:20px;max-width:720px;margin:0 auto}
  .iw h3{margin:0 0 2px;font-size:16px;font-weight:600}
  .iw .sub{margin:0 0 12px;font-size:13px;color:var(--ink-soft)}
  .iw .page{border:1px solid var(--hairline);border-radius:5px;background:#fff;min-height:330px;padding:14px}
  .iw .panelart{display:block;width:100%;height:auto}
  .iw .cap{font-size:13.5px;line-height:1.55;margin:10px 4px 0}
  .iw .cap b{font-family:var(--mono);font-size:12px}
  .iw .nav{display:flex;gap:8px;align-items:center;margin-top:12px}
  .iw button{font-family:var(--mono);font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--hairline);
    border-radius:3px;padding:5px 14px;cursor:pointer}
  .iw button:hover{border-color:var(--machine)}
  .iw button:disabled{opacity:.35;cursor:default}
  .iw .pgno{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin-left:auto}
  .iw table{border-collapse:collapse;font-family:var(--mono);font-size:11px;width:100%;margin:6px 0}
  .iw th,.iw td{border:0.5px solid var(--hairline);padding:4px 6px;text-align:left}
  .iw th{color:var(--ink-soft);font-weight:400;text-transform:uppercase;font-size:9.5px;letter-spacing:.03em}
  .iw .tt-title{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:8px 0 2px}
  .iw .bill{font-family:var(--mono);font-size:12px;margin-top:6px}
  .iw .shelfc{color:var(--shelf)}.iw .askerc{color:var(--asker)}
  @media (prefers-reduced-motion:reduce){.iw *{transition:none!important}}
</style>
</head>
<body style="margin:0;padding:24px;background:#f3f1ec;">
<figure class="iw">
  <h3>the itinerary — a comic in seven pages</h3>
  <p class="sub">flip through the machine's day at toy scale (N = 4 tokens, d = 2, blocks of 2). teal = shelf (K, V — read-only merchandise). purple = askers (Q with their O blends and notebooks — stateful, wet paint). the last page hauls in the full timetables for u to verify.</p>
  <div class="page" id="page"></div>
  <div class="nav">
    <button id="prev">← prev</button>
    <button id="next">next →</button>
    <span class="pgno" id="pgno"></span>
  </div>
</figure>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function svgWorld(hl){ // hl: {res:'s1'|'s2'|'A'|'B', vis:same, minted:[tiles]}
    hl=hl||{};var s='<svg class="panelart" viewBox="0 0 680 200">';
    // HBM strip
    s+='<rect x="10" y="10" width="200" height="180" rx="6" fill="none" stroke="#E4E1DA"/>'
     +'<text x="20" y="28" font-family="SF Mono,monospace" font-size="10" fill="#8A8A93">HBM (warehouse)</text>';
    var items=[['s1','K,V rows 1-2','#1E7A62'],['s2','K,V rows 3-4','#1E7A62'],['A','Q,O rows 1-2 +nb','#5A50C0'],['B','Q,O rows 3-4 +nb','#5A50C0']];
    items.forEach(function(it,i){
      var y=40+i*36, on=(hl.res===it[0]||hl.vis===it[0]);
      s+='<rect x="20" y="'+y+'" width="180" height="26" rx="4" fill="'+(on?(it[2]==='#1E7A62'?'rgba(30,122,98,.12)':'rgba(90,80,192,.12)'):'#fff')+'" stroke="'+it[2]+'" stroke-width="'+(on?1.6:0.7)+'" '+(hl.gone&&hl.gone.indexOf(it[0])>=0?'opacity="0.35"':'')+'/>'
       +'<text x="30" y="'+(y+17)+'" font-family="SF Mono,monospace" font-size="10" fill="#1A1A1E">'+it[1]+'</text>';
    });
    // bench
    s+='<rect x="250" y="10" width="230" height="180" rx="6" fill="none" stroke="#1A1A1E" stroke-width="1.2"/>'
     +'<text x="260" y="28" font-family="SF Mono,monospace" font-size="10" fill="#8A8A93">SRAM (bench)</text>';
    if(hl.res){var isS=hl.res[0]==='s';
      s+='<rect x="262" y="40" width="206" height="34" rx="4" fill="'+(isS?'rgba(30,122,98,.12)':'rgba(90,80,192,.12)')+'" stroke="'+(isS?'#1E7A62':'#5A50C0')+'" stroke-width="1.4"/>'
       +'<text x="272" y="61" font-family="SF Mono,monospace" font-size="10">resident: '+(isS?('section '+hl.res[1]):('block '+hl.res))+'</text>';}
    if(hl.vis){var isS2=hl.vis[0]==='s';
      s+='<rect x="262" y="84" width="206" height="34" rx="4" fill="'+(isS2?'rgba(30,122,98,.12)':'rgba(90,80,192,.12)')+'" stroke="'+(isS2?'#1E7A62':'#5A50C0')+'" stroke-dasharray="5 3" stroke-width="1.4"/>'
       +'<text x="272" y="105" font-family="SF Mono,monospace" font-size="10">visiting: '+(isS2?('section '+hl.vis[1]):('block '+hl.vis))+'</text>';}
    if(hl.tile){s+='<rect x="262" y="128" width="206" height="30" rx="4" fill="url(#h)" stroke="#5A50C0"/>'
       +'<text x="272" y="147" font-family="SF Mono,monospace" font-size="10">tile minted: '+hl.tile+'</text>'
       +'<defs><pattern id="h" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(90,80,192,.10)"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5A50C0" stroke-width="1"/></pattern></defs>';}
    // S ghost
    s+='<rect x="520" y="10" width="150" height="150" rx="6" fill="none" stroke="#5A50C0" stroke-dasharray="4 3" opacity="0.8"/>'
     +'<text x="530" y="28" font-family="SF Mono,monospace" font-size="10" fill="#8A8A93">S (never exists)</text>';
    var pos={11:[520,35],12:[595,35],21:[520,105],22:[595,105]};
    (hl.minted||[]).forEach(function(t){var p=pos[t];
      s+='<rect x="'+p[0]+'" y="'+p[1]+'" width="75" height="70" fill="#EFEDE6" stroke="#8A8A93" stroke-width="0.6"/>'
       +'<text x="'+(p[0]+30)+'" y="'+(p[1]+40)+'" font-size="11" fill="#8A8A93">✓</text>';});
    s+='<text x="520" y="180" font-family="SF Mono,monospace" font-size="9.5" fill="#8A8A93">tiles minted, consumed, evicted</text>';
    return s+'</svg>';
  }
  var timetables='<div class="tt-title">FA-1 — shelf resident, askers commute</div>'
   +'<table><tr><th>event</th><th>resident</th><th>commuter</th><th>trucks this event</th></tr>'
   +'<tr><td>haul 1</td><td class="shelfc">section 1 in</td><td>—</td><td>K,V rows 1-2: 8 in</td></tr>'
   +'<tr><td>visit 1</td><td class="shelfc">section 1</td><td class="askerc">block A</td><td>Q in 4 · O in 4 · O out 4</td></tr>'
   +'<tr><td>visit 2</td><td class="shelfc">section 1</td><td class="askerc">block B</td><td>Q in 4 · O in 4 · O out 4</td></tr>'
   +'<tr><td>haul 2</td><td class="shelfc">section 2 in</td><td>—</td><td>K,V rows 3-4: 8 in</td></tr>'
   +'<tr><td>visit 3</td><td class="shelfc">section 2</td><td class="askerc">block A returns</td><td>Q in 4 · O in 4 · O out 4</td></tr>'
   +'<tr><td>visit 4</td><td class="shelfc">section 2</td><td class="askerc">block B returns</td><td>Q in 4 · O in 4 · O out 4</td></tr></table>'
   +'<div class="bill">bill: <span class="shelfc">shelf 2×8 = 16</span> + <span class="askerc">askers 4×12 = 48</span> = <b>64</b></div>'
   +'<div class="tt-title" style="margin-top:14px">the flip (FA-2) — askers resident, shelf commutes</div>'
   +'<table><tr><th>event</th><th>resident</th><th>commuter</th><th>trucks this event</th></tr>'
   +'<tr><td>haul 1</td><td class="askerc">block A in</td><td>—</td><td>Q rows 1-2: 4 in · O born on bench</td></tr>'
   +'<tr><td>visit 1</td><td class="askerc">block A</td><td class="shelfc">section 1</td><td>K,V in: 8</td></tr>'
   +'<tr><td>visit 2</td><td class="askerc">block A</td><td class="shelfc">section 2</td><td>K,V in: 8</td></tr>'
   +'<tr><td>ship</td><td>—</td><td>—</td><td class="askerc">O rows 1-2 out ONCE, finished: 4</td></tr>'
   +'<tr><td>haul 2</td><td class="askerc">block B in</td><td>—</td><td>Q rows 3-4: 4 in · O born on bench</td></tr>'
   +'<tr><td>visit 3</td><td class="askerc">block B</td><td class="shelfc">section 1 again</td><td>K,V in: 8</td></tr>'
   +'<tr><td>visit 4</td><td class="askerc">block B</td><td class="shelfc">section 2 again</td><td>K,V in: 8</td></tr>'
   +'<tr><td>ship</td><td>—</td><td>—</td><td class="askerc">O rows 3-4 out once: 4</td></tr></table>'
   +'<div class="bill">bill: <span class="askerc">askers 2×(4+4) = 16</span> + <span class="shelfc">shelf 4×8 = 32</span> = <b>48</b> — the wet paint never travelled. verify every row against the pages u just flipped.</div>';
  var pages=[
    {art:svgWorld({}), cap:'<b>page 1 — the world.</b> four tokens, N = 4, d = 2. everything lives in HBM: the shelf (K, V — teal, read-only merchandise) chopped into two sections, and the askers (Q with their O blends and notebooks — purple, stateful) chopped into two blocks. the score matrix S, dashed on the right, will never exist. the bench in the middle is tiny: one section OR one block at a time, plus a tile.'},
    {art:svgWorld({res:'s1'}), cap:'<b>page 2 — round 1 opens (FA-1).</b> shelf section 1 is hauled in and takes residence: 8 numbers ride the courier (K rows 1-2, V rows 1-2). it will sit here, read-only, while every asker files past.'},
    {art:svgWorld({res:'s1',vis:'A',tile:'A × sec1',minted:[11]}), cap:'<b>page 3 — block A visits.</b> three trucks for the visitor: Q rows 1-2 in, O rows 1-2 in (zeros this first time — the notebooks initialise on the bench), and after minting tile (A, sec1), digesting it into ⟨m, r, o⟩... O rows OUT. the blends are wet paint — half-finished, awaiting section 2 — and they must survive eviction. that forced out-trip is the whole story.'},
    {art:svgWorld({res:'s1',vis:'B',tile:'B × sec1',minted:[11,21]}), cap:'<b>page 4 — block B visits.</b> same three trucks, same anatomy. section 1 has now served everyone; its tour is over. notice the ledger so far: shelf hauled once, askers already 2 visits deep.'},
    {art:svgWorld({res:'s2',vis:'A',tile:'A × sec2',minted:[11,21,12]}), cap:'<b>page 5 — round 2: block A RETURNS.</b> section 2 takes residence (8 more shelf numbers), and here is the expensive part: block A must come back — Q in again, and its half-finished O in again for repair (coups and dilution, section 5\u2019s laws), then out again. the wet paint commutes.'},
    {art:svgWorld({res:'s2',vis:'B',tile:'B × sec2',minted:[11,21,12,22]}), cap:'<b>page 6 — the last visit.</b> block B returns, tile (B, sec2) minted, all four tiles now minted exactly once — and the full S never existed anywhere. final bill: shelf 16, askers 48 — total 64. the askers paid 3× the shelf, because they carry wet paint both ways. which begs the question the paper didn\u2019t ask: what if the roles swapped?'},
    {art:'', cap:'<b>page 7 — the timetables, hauled in for ur audit.</b> both schedules, identical structure, subjects swapped. count every truck urself — then note where the 16-truck difference lives: the flip\u2019s resident askers never re-commute, and O ships exactly once, finished. <i>the light traveler should commute.</i> this flip is FlashAttention-2\u2019s move (its headline motive — parallelism — is next article\u2019s territory).', tables:true}
  ];
  var i=0;
  function render(){
    var p=pages[i];
    $('page').innerHTML=(p.art||'')+(p.tables?timetables:'')+'<p class="cap">'+p.cap+'</p>';
    $('prev').disabled=(i===0); $('next').disabled=(i===pages.length-1);
    $('pgno').textContent='page '+(i+1)+' / '+pages.length;
  }
  $('prev').onclick=function(){if(i>0){i--;render();}};
  $('next').onclick=function(){if(i<pages.length-1){i++;render();}};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight')$('next').click(); if(e.key==='ArrowLeft')$('prev').click();});
  render();
})();
</script>
</body>
</html>
